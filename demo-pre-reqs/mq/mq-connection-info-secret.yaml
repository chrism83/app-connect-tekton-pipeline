#
# Secret with IBM MQ Queue Manager connection details.
# Used by the Tekton pipeline to substitute TEMPLATE_MQ_HOST and TEMPLATE_MQ_PORT
# in the ACE policy project (tcpip-mq-policies/QMGRNATIVEHA.policyxml).
#
# Queue Manager: QMGRNATIVEHA
# Host: qmgr-native-ha-ibm-mq.cp4i-mq.svc (internal ClusterIP service)
# Port: 1414 (standard IBM MQ client port)
#
# Apply before running the pipeline:
#   oc apply -f demo-pre-reqs/mq/mq-connection-info-secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: mq-connection-info
  namespace: tools
stringData:
  host: "qmgr-native-ha-ibm-mq.cp4i-mq.svc"
  port: "1414"
